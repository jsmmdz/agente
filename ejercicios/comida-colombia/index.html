<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comida Típica de Colombia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>Sabores de Colombia</h1>
    <p class="subtitle">Un recorrido por platos típicos de cada región</p>
  </header>

  <main>
    <div id="inventario"></div>
  </main>

  <footer class="site-footer">
    <p>Catálogo con fines educativos — DOM + arrays de objetos</p>
  </footer>

  <!--
    Esta plantilla NO se muestra en pantalla (así funciona <template>):
    el navegador la guarda lista para clonar pero no la renderiza.
    index.js clona su contenido una vez por cada plato del array y llena
    los elementos .js-* con los datos de ese plato. Por eso acá abajo no
    hay ninguna tarjeta "real" escrita a mano.
  -->
  <template id="plato-template">
    <article class="food-card">
      <!-- .food-flipper es el que realmente gira (rotateY). Adentro tiene
           dos caras superpuestas: cuando una mira al frente, la otra mira
           "hacia atrás" (por eso food-face--back nace rotada 180°). -->
      <div class="food-flipper">
        <div class="food-face food-face--front">
          <div class="food-img-frame">
            <img class="js-imagen" src="" alt="" />
          </div>

          <div class="food-body">
            <div class="food-header">
              <h2 class="js-nombre"></h2>
              <span class="js-vegetariano food-veg-tag"></span>
            </div>

            <span class="js-region food-region-tag"></span>

            <p class="js-descripcion food-descripcion"></p>

            <p class="js-numero food-numero"></p>
          </div>
        </div>

        <div class="food-face food-face--back">
          <p class="food-hover-item" aria-label="Tiempo de preparación">
            <span class="food-hover-icon" aria-hidden="true">⏱</span>
            <span class="js-tiempo"></span>
          </p>
          <p class="food-hover-item" aria-label="Sabores dominantes">
            <span class="food-hover-icon" aria-hidden="true">👅</span>
            <span class="js-sabores"></span>
          </p>
          <p class="food-hover-item" aria-label="Región tradicional">
            <span class="food-hover-icon" aria-hidden="true">📍</span>
            <span class="js-region-hover"></span>
          </p>
        </div>
      </div>
    </article>
  </template>

  <script src="index.js"></script>
</body>
</html>
