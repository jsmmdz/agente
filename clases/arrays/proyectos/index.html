<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabores de Colombia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <h1>Sabores de Colombia</h1>
  <p class="subtitle">Un recorrido por platos típicos de cada región</p>
</header>

<main>
  <div id="inventario"></div>
</main>

<!--
  Esta plantilla NO se muestra en pantalla (así funciona <template>):
  el navegador la guarda lista para clonar pero no la renderiza.
  script.js clona su contenido una vez por cada plato del array y llena
  los elementos .js-* con los datos de ese plato. Por eso acá abajo no
  hay ninguna tarjeta "real" escrita a mano.
-->
<template id="plato-template">
  <article class="food-card">
    <!-- .food-flipper es el que realmente gira (rotateY). Adentro tiene
         dos caras superpuestas: cuando una mira al frente, la otra mira
         "hacia atrás" (por eso food-face--back nace rotada 180°). -->
    <div class="food-flipper">
      <div class="food-face food-face--front">
        <div class="food-img-frame">
          <img class="js-imagen" src="" alt="" />
        </div>

        <!-- La región y si es vegetariano ya no van aquí: se movieron a la
             cara de atrás para que el frente quede limpio (foto + nombre +
             descripción) y el detalle aparezca al girar la tarjeta. -->
        <div class="food-body">
          <h2 class="js-nombre food-nombre"></h2>
          <p class="js-descripcion food-descripcion"></p>
        </div>
      </div>

      <div class="food-face food-face--back">
        <h3 class="js-nombre-back food-back-title"></h3>

        <!-- Los íconos son SVG en línea (no emojis): usan currentColor y
             stroke, así se ven iguales en todos los sistemas y heredan el
             color del contenedor desde el CSS. -->
        <ul class="food-back-list">
          <li class="food-hover-item" aria-label="Tiempo de preparación">
            <span class="food-hover-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
            </span>
            <span class="food-hover-text">
              <span class="food-hover-label">Preparación</span>
              <span class="js-tiempo food-hover-value"></span>
            </span>
          </li>

          <li class="food-hover-item" aria-label="Sabores dominantes">
            <span class="food-hover-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><ellipse cx="12" cy="8" rx="3.8" ry="5.2"/><path d="M12 13.2V21"/></svg>
            </span>
            <span class="food-hover-text">
              <span class="food-hover-label">Sabores</span>
              <span class="js-sabores food-hover-value"></span>
            </span>
          </li>

          <li class="food-hover-item" aria-label="Región de origen">
            <span class="food-hover-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
            </span>
            <span class="food-hover-text">
              <span class="food-hover-label">Región</span>
              <span class="js-region food-hover-value"></span>
            </span>
          </li>

          <!-- Este ítem tiene dos íconos (hoja y presa de carne) y el JS deja
               visible solo el que corresponde según esVegetariano. -->
          <li class="js-dieta-item food-hover-item" aria-label="Tipo de plato">
            <span class="food-hover-icon" aria-hidden="true">
              <svg class="js-icono-veg" viewBox="0 0 24 24"><path d="M5 19c0-8.5 5.5-13.5 14-14.5 0 9-5 14.5-13.5 14.5"/><path d="M5 19 13 11"/></svg>
              <svg class="js-icono-carne" viewBox="0 0 24 24" hidden><path d="M15 3.5a5.5 5.5 0 0 1 3.9 9.4l-1.3 1.3-7.8-7.8 1.3-1.3A5.5 5.5 0 0 1 15 3.5z"/><path d="M10.8 12.2 6 17"/><circle cx="4.9" cy="17.6" r="1.4"/><circle cx="6.4" cy="19.1" r="1.4"/></svg>
            </span>
            <span class="food-hover-text">
              <span class="food-hover-label">Tipo de plato</span>
              <span class="js-dieta food-hover-value"></span>
            </span>
          </li>
        </ul>
      </div>
    </div>
  </article>
</template>

<!--
  Modal de detalle: arranca oculto con el atributo hidden. script.js le saca
  ese atributo al hacer clic en una tarjeta y lo vuelve a poner al cerrar.
  Vive fuera de #inventario porque es un solo modal compartido por todas las
  tarjetas, no uno por plato.
-->
<div id="modal-plato" class="modal-overlay" hidden>
  <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="modal-nombre">
    <button id="modal-cerrar" class="modal-cerrar" aria-label="Cerrar">✕</button>

    <img id="modal-imagen" class="modal-imagen" src="" alt="">

    <div class="modal-contenido">
      <h2 id="modal-nombre" class="modal-nombre"></h2>

      <dl class="modal-detalles">
        <div class="modal-detalle-item">
          <dt>Región</dt>
          <dd id="modal-region"></dd>
        </div>
        <div class="modal-detalle-item">
          <dt>Tiempo de preparación</dt>
          <dd id="modal-tiempo"></dd>
        </div>
        <div class="modal-detalle-item">
          <dt>Tipo de plato</dt>
          <dd id="modal-dieta"></dd>
        </div>
        <div class="modal-detalle-item">
          <dt>Sabores dominantes</dt>
          <dd id="modal-sabores"></dd>
        </div>
      </dl>

      <p id="modal-descripcion" class="modal-descripcion"></p>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
